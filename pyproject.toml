[project]
name = "rezeptor"
version = "0.0.0"
description = "Rezeptor launcher (dev metadata for tooling)"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
src = ["launcher"]
line-length = 100
extend-exclude = [
  "launcher/assets",
]

[tool.ruff.lint]
# Practical baseline: unused code + syntax/logic traps. E402 is expected after
# sys.path bootstrap / optional-import try blocks in the launcher entrypoints.
select = [
  "E9", # runtime syntax errors
  "F",  # pyflakes
]
ignore = [
  "E402", # module import not at top (path bootstrap before local imports)
]

[tool.ruff.lint.per-file-ignores]
# Fluent optional imports re-export names for typing/call sites.
"launcher/ui_fluent.py" = ["F401"]

[tool.vulture]
# Opt-in dead-code scan (make dead-code). Not part of make validate:
# Qt slots/attributes and optional Fluent re-exports produce noise below 80%.
min_confidence = 80
paths = ["launcher", "scripts/vulture_whitelist.py"]
exclude = ["launcher/assets"]
