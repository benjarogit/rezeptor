id: photoshop-m0nkrus-220
schema_version: 1
icon: "{repo}/images/AdobePhotoshop-icon.png"
name: "Adobe Photoshop CC 2021 (m0nkrus 22.0.0.35)"
author: "benjarogit"
category: "Grafik & Design"
version_guaranteed: "22.0.0.35"
version_label: "Adobe Photoshop CC 2021 (22.0.0.35, m0nkrus Pack Photoshop.2021)"
version_detect:
  - kind: json_key
    glob: "products/PHSP/application.json"
    key: ProductVersion
  - kind: json_key
    glob: "products/PHSP/Application.json"
    key: ProductVersion
  - kind: json_key
    glob: "**/PHSP/application.json"
    key: ProductVersion
sidebar_label: "Photoshop"
source_hints:
  - "Adobe Photoshop 2021 (v22.0) Multilingual"
  - "Adobe.Photoshop.2021.Multilingual"
  - "Photoshop.2021"
  - "rutracker"
  - "m0nkrus"
notify_title: "Photoshop CC 2021"
data_root: "~/.local/share/wine-software/photoshop-m0nkrus-220"
prefix: "{data_root}/prefix"
runtime: proton-ge
install_type: installer_offline
source_kind: folder
# Empfohlen: Pack-Ordner mit ISO (ohne Neural/GenP) oder die ISO selbst.
source_label: "Pack-Ordner (Photoshop.2021) oder Adobe.Photoshop.2021.Multilingual.iso"
target_default: "~/.local/share/wine-software/photoshop-m0nkrus-220"
target_label: "Datenordner (Wine-Prefix wird hier angelegt)"
fix_kind: none
exe_glob: "**/Photoshop.exe"
launch_process_patterns: [Photoshop.exe]
# win10 via recipe_win10::ensure; VC++ via recipe_vcrun::ensure (nicht winetricks)
winetricks: [atmlib, corefonts, "fontsmooth=rgb", gdiplus, msxml3, msxml6, ie8]
env:
  WINEDEBUG: "-all,+err"
validate: validate.sh
launch: launch.sh
install: install.sh
repair: repair.sh
kill: kill.sh
uninstall: uninstall.sh
install_steps:
  - module: recipe_photoshop::install
