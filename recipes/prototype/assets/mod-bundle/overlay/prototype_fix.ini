# PrototypeFix - by emoose
# https://www.nexusmods.com/prototype/mods/52 / https://www.nexusmods.com/prototype2/mods/42

[Graphics]
# FOVOffset: increases/decreases the games FOV by this amount (use negative number to decrease)
#  Vanilla game usually uses between 70 - 90 degree FOV, depending on zoom level
#  The value here will be added to the FOV that game wants to use
#  Setting this between 10 - 20 may be an improvement for some
#  Default: 0 (disabled)
FOVOffset = 0.0

# ShadowMapResolution: if set above 0, allows increasing the shadow resolution past vanilla games 2048x2048 limit
#  May have slight performance cost to increasing it, only recommend if you have spare headroom
#  The in-game shadow setting will still adjust shadow distance, but the resolution will always be forced to this if non-zero
#  Default: 0, using 0 will leave it unchanged, valid range is powers of 2 from 512-8192
ShadowMapResolution = 0

# CustomResolution[0]: if not set to 0, will override the 640x480 resolution option with this resolution
#  (P1 should use this resolution automatically, but is unable to display it in the settings menu)
#  -1 will make it use your desktop resolution (across all monitors)
#  This only patches the menu list. Continue still Reset()s to 1280x720/800.
#  force_desktop_res.asi (1.2.3) pins those Resets to the desktop size.
CustomResolution[0].Width = -1
CustomResolution[0].Height = -1

# CustomResolution[1] (P2 only): if not set to 0, will override the 800x600 resolution option with this resolution
CustomResolution[1].Width = -1
CustomResolution[1].Height = -1

# WindowResolution: if not set to 0, will override the size of the window when playing game with "windowed" launch option
#  (game will run at lower framerate when window isn't focused, you can use "NoSleepOnLostFocus" launch param to disable this)
WindowResolution.Width = -1
WindowResolution.Height = -1

# BorderlessWindow: tries running the game in a borderless window
#  For this to work you should set WindowResolution above to your native desktop resolution first (-1 will use it automatically)
#  1.2.2 exclusive survived frontend Reset but Continue Present stalled
#  (VK_ERROR_OUT_OF_DATE_KHR, music alive, Alt+F4 eaten). force_desktop_res
#  now pins 1080p AND Windowed. Borderless keeps a real HWND for WM_CLOSE.
BorderlessWindow = true

[Performance]
# DInputKeyboardMouseOnly: helps improve performance by forcing game to only make use of keyboard & mouse DInput devices
#  (in vanilla game it would try using every HID device on your system, causing a large performance drop on modern systems which may have many HID devices)
#  Gamepads are handled through XInput and aren't affected by this fix
#  Default: true
DInputKeyboardMouseOnly = true

# RemoveTickRateLimit: removes the ~66FPS tickrate limit applied by the game engine, which could cause frame-doubling and mouse input issues
#  Can also fix the issue with event countdowns taking much longer than they should
#  ONLY RECOMMEND IF PLAYING ABOVE 60FPS - removing this limit may slightly alter gameplay, eg. making certain button-mash sections harder at higher framerates
#  (The FixButtonTapTickRate fix below may be able to help with button-mashing with this)
#  Default: false
RemoveTickRateLimit = false

# FixButtonTapTickRate: fixes the button-mashing issues when RemoveTickRateLimit is enabled, so it'll require the same amount of button-mashing between different framerates
#  Should make it easier to hijack vehicles when playing at high tick-rate
#  Experimental, please let me know if you notice anything act up after enabling this!
#  Default: false (if set to true, will only be enabled if RemoveTickRateLimit is also enabled)
FixButtonTapTickRate = false

# FPSLimitOverride: if set above 0, will override the games default 500FPS limiter to limit to the specified framerate instead
#  1000+FPS is possible with this, though game is likely to have some issues at very high framerates!
#  May also be useful for limiting the game to the G-Sync/FreeSync framerate window (usually around display refresh rate minus 1)
#  (for best results, disable any VSync setting in the games settings)
#  Default: 0 (disabled)
FPSLimitOverride = 0

# VRAMAmount: if set above 0 will force game to assume this much VRAM, instead of using the broken VRAM calculation that it used previously
#  Enabling this should allow MSAAx4 to be used on newer cards, and also slightly improve performance since game will now actually use the increased memory
#  Default: 2048 (likely the safest value, game may have issues near 4GB)
VRAMAmount = 2048

[Misc]
# PreferLooseFiles: rewrites games file loader so that loose/unpacked files will take priority over files inside .RCF packages
#  In vanilla game it would normally ignore any loose version if it existed inside a .RCF, making modding a bit harder
#  This tweak can act as a mod-loader, allowing modded files to be loaded from the game folder, while vanilla files can still be read from .RCF
#  (in other words, no need to fully unpack .rcf files & then delete them anymore!)
#  This is defaulted to true since there isn't any harm in it, but if needed this can be disabled here
#  Default: true
PreferLooseFiles = true

# UnlockDevMenu (P1 only): if enabled, unlocks dev menu on main menu & tilde menu on pause screen
#  Same as applying the RAD_RELEASE patch, just without needing to modify game files
#  Default: false
UnlockDevMenu = false

[Audio]
# MaxSampleRate (P1 only): allows changing the max sample rate supported by the game
#  Vanilla game is hardcoded to 48000Hz, causing audio to speed up if the audio device only supports higher sample rates
#  Changing this to a higher rate should allow any devices up to that rate to work fine
#  So by default we change this to 384000Hz, which should allow it to work on the majority of setups
#  If you run into audio issues you can disable this by setting it to 0, or maybe try increasing to a higher rate
#  Default: 384000
MaxSampleRate = 384000

[CrashFixes]
# CPUThreadCountFix: fixes crash during load screen caused by having too many CPU cores
#  With this enabled you should no longer need to change core affinity for the game, any scripts that change affinity can be removed
#  Default: true
CPUThreadCountFix = true

# BillboardAdFix (P1 only): fixes a crash that happens a few seconds after loading in, caused by game trying to download billboard advert textures from no-longer-existing server
#  Default: true
BillboardAdFix = true

[PrototypeFix]
# VerboseLogging: prints extra debug info into log file if enabled
VerboseLogging = false
